services:
  - type: web
    name: karigarconnect-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/karigar_connect.db
      - key: CORS_ORIGINS
        value: '*'