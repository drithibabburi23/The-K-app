<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The K App</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #28251f;
        background: #f4efe4;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid #d8cdb9;
        border-radius: 1.5rem;
        background: #fffdf8;
        box-shadow: 0 1.5rem 4rem rgb(70 54 27 / 12%);
      }

      p {
        max-width: 60ch;
        color: #625b50;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .eyebrow {
        color: #9a4f2e;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.45rem 0 1rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 0.95;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Project status</div>
      <h1>The K App</h1>
      <p>
        The repository currently contains the product architecture and integration documentation,
        but no deployable Flutter application source. This page keeps the project deployment
        available until the Flutter package is added.
      </p>
    </main>
  </body>
</html>
